<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TATNERA – Testzugang einrichten</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#f5f2ec;padding:24px}
    .card{width:min(460px,100%);background:#191919;border:1px solid #333;border-radius:18px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
    h1{margin:0 0 8px;font-size:27px}.muted{color:#aaa;line-height:1.5}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#c59a54;margin-bottom:8px}
    label{display:block;margin-top:16px;font-size:13px;font-weight:700}input{width:100%;margin-top:7px;border:1px solid #3b3b3b;border-radius:11px;background:#101010;color:#fff;padding:13px 14px;font-size:15px}
    input[readonly]{color:#aaa}.btn{width:100%;margin-top:20px;border:0;border-radius:11px;background:#c59a54;color:#15110b;padding:13px 16px;font-size:15px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}
    #status{min-height:22px;margin-top:14px;font-size:13px}.ok{color:#8ed19a}.error{color:#ff9797}a{color:#d9b66f}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">TATNERA Testzugang</div>
    <h1>Zugang einrichten</h1>
    <p class="muted">Der Zugang gehört zu einem eigenen, leeren Teststudio.</p>
    <form id="setupForm">
      <label>E-Mail<input id="email" type="email" readonly></label>
      <label>Name<input id="displayName" required value="Testzugang 1"></label>
      <label>Passwort<input id="password" type="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn" id="submitBtn" type="submit">Testzugang erstellen</button>
    </form>
    <div id="status"></div>
  </main>
<script>
(() => {
  const params=new URLSearchParams(location.search);
  const fragment=new URLSearchParams(location.hash.replace(/^#/,''));
  const invite=params.get('invite')||'';
  const email=params.get('email')||'';
  const defaultName=params.get('name')||'Testzugang 1';
  const emailEl=document.getElementById('email');
  const nameEl=document.getElementById('displayName');
  const passwordEl=document.getElementById('password');
  const form=document.getElementById('setupForm');
  const status=document.getElementById('status');
  const button=document.getElementById('submitBtn');
  emailEl.value=email;nameEl.value=defaultName;
  const fragmentPassword=fragment.get('pw')||'';
  if(fragmentPassword)passwordEl.value=fragmentPassword;
  if(!invite||!email){status.className='error';status.textContent='Der Einrichtungslink ist unvollständig.';button.disabled=true;return;}

  async function submitSetup(){
    button.disabled=true;status.className='';status.textContent='Zugang wird erstellt …';
    try{
      const response=await fetch('https://ayxvspeufbsoxtccaqap.supabase.co/functions/v1/accept-studio-invite',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:invite,email,password:passwordEl.value,displayName:nameEl.value.trim()})
      });
      const data=await response.json().catch(()=>({}));
      if(!response.ok||!data.ok)throw new Error(data.error||'Zugang konnte nicht erstellt werden.');
      history.replaceState(null,'',location.pathname+'?done=1');
      status.className='ok';status.innerHTML='Zugang erstellt. <a href="app.html">Jetzt zu TATNERA →</a>';
      form.style.display='none';
    }catch(error){status.className='error';status.textContent=error.message||String(error);button.disabled=false;}
  }

  form.addEventListener('submit',event=>{event.preventDefault();submitSetup();});
  if(fragmentPassword&&fragment.get('auto')==='1')setTimeout(()=>submitSetup(),250);
})();
</script>
</body>
</html>
